services:
  db:
    image: postgres:16-alpine
    container_name: soft-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: soft
      POSTGRES_PASSWORD: soft
      POSTGRES_DB: soft
    volumes:
      - soft_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soft -d soft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  soft_pg_data:
